name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      
      # We cannot easily cache apt packages, but we can cache ccache
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libpqxx-dev libfmt-dev libspdlog-dev uuid-dev libgtest-dev google-mock \
            libeigen3-dev nlohmann-json3-dev libcpp-httplib-dev \
            pkg-config ccache

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure CMake
        run: |
          export CCACHE_DIR=$HOME/.ccache
          cmake -B build -S . -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure -R UnitTests

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: build-and-test # Optional: depend on build to fail fast
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: telemetry
        ports:
          - 5432:5432
        # Set health check to ensure DB is ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libpqxx-dev libfmt-dev libspdlog-dev uuid-dev libgtest-dev google-mock \
            libeigen3-dev nlohmann-json3-dev libcpp-httplib-dev \
            pkg-config ccache postgresql-client

      - name: Check schema drift (init.sql vs migrations)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: password
          PGDATABASE: postgres
        run: ./scripts/check_schema_drift.sh

      - name: Initialize Database Schema
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U postgres -d telemetry -f db/init.sql

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build Integration Tests
        run: cmake --build build --target db_integration_tests -j$(nproc)

      - name: Run Integration Tests
        env:
          DB_CONNECTION_STRING: "postgresql://postgres:password@localhost:5432/telemetry"
        run: ./build/db_integration_tests

  docker-check:
    name: Validate Docker Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build . --target runtime

  web-ui-build:
    name: Flutter Web Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Web UI
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE/web_ui
          cd web_ui
          flutter pub get
          # Wasm dry-run and tree-shaken icon messages are warnings, not CI-fatal errors.
          # Keep defaults enabled so compatibility and size regressions remain visible.
          flutter build web --release

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang-tidy \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libpqxx-dev libfmt-dev libspdlog-dev uuid-dev libgtest-dev google-mock \
            libeigen3-dev nlohmann-json3-dev libcpp-httplib-dev \
            pkg-config
      - name: Configure
        run: cmake -B build -S . -DENABLE_CLANG_TIDY=ON
      - name: Build (runs clang-tidy)
        run: cmake --build build -j$(nproc)

  sanitizer-probe:
    name: Sanitizer Probe (Non-blocking)
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:fast_unwind_on_malloc=0"
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake llvm \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libpqxx-dev libfmt-dev libspdlog-dev uuid-dev libgtest-dev google-mock \
            libeigen3-dev nlohmann-json3-dev libcpp-httplib-dev \
            pkg-config
      - name: Configure
        run: cmake -B build -S . -DENABLE_ASAN=ON -DENABLE_UBSAN=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      
      - name: Run Unit Tests (Excluding known gRPC mismatch)
        run: |
          set -o pipefail
          ./build/unit_tests --gtest_filter='-GeneratorClientTest.BreakerOpensOnFailures' 2>&1 | tee asan_all_except_known.log

      - name: Run Known Mismatch Test (Expected to fail)
        continue-on-error: true
        run: |
          set -o pipefail
          ./build/unit_tests --gtest_filter='GeneratorClientTest.BreakerOpensOnFailures' 2>&1 | tee asan_known_grpc_mismatch.log

      - name: Upload Sanitizer Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs
          path: |
            *.log
            build/CMakeCache.txt
            build/compile_commands.json
