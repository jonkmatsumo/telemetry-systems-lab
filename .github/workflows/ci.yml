name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  POSTGRES_USER: postgres
  POSTGRES_DB: telemetry
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || format('ci-{0}', github.run_id) }}

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      
      # We cannot easily cache apt packages, but we can cache ccache
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libpqxx-dev libfmt-dev libspdlog-dev uuid-dev libgtest-dev google-mock \
            libeigen3-dev nlohmann-json3-dev libcpp-httplib-dev \
            pkg-config ccache

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure CMake
        run: |
          export CCACHE_DIR=$HOME/.ccache
          cmake -B build -S . -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure -R UnitTests

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: build-and-test # Optional: depend on build to fail fast
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        # Set health check to ensure DB is ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libpqxx-dev libfmt-dev libspdlog-dev uuid-dev libgtest-dev google-mock \
            libeigen3-dev nlohmann-json3-dev libcpp-httplib-dev \
            pkg-config ccache postgresql-client

      - name: Check schema drift (init.sql vs migrations)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: ${{ env.POSTGRES_USER }}
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
          PGDATABASE: postgres
        run: ./scripts/check_schema_drift.sh

      - name: Initialize Database Schema
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f db/init.sql

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build Integration Tests
        run: cmake --build build --target db_integration_tests -j$(nproc)

      - name: Run Integration Tests
        env:
          DB_CONNECTION_STRING: "postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}"
        run: ./build/db_integration_tests

  docker-check:
    name: Validate Docker Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build . --target runtime

  web-ui-build:
    name: Flutter Web Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Web UI
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE/web_ui
          cd web_ui
          flutter pub get
          # Wasm dry-run and tree-shaken icon messages are warnings, not CI-fatal errors.
          # Keep defaults enabled so compatibility and size regressions remain visible.
          flutter build web --release

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang-tidy \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libpqxx-dev libfmt-dev libspdlog-dev uuid-dev libgtest-dev google-mock \
            libeigen3-dev nlohmann-json3-dev libcpp-httplib-dev \
            pkg-config
      - name: Configure
        run: cmake -B build -S . -DENABLE_CLANG_TIDY=ON
      - name: Build (runs clang-tidy)
        run: cmake --build build -j$(nproc)
